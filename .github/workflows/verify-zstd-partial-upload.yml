name: Verify zstd partial upload retry

on:
  push:
    branches: [ci-verify-zstd-partial-upload-20261125]

permissions: {}

jobs:
  upload:
    if: github.repository == 'ievav100/zstd'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    env:
      RELEASE_TAG: ci-verify-zstd-draft-20261125
      BUILD_HEAD: 81decba7bef763d5996b84560b8408327a2ec4d9
    steps:
      - name: Download the signed packages from the original Windows builds
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # tag=v8.0.2
        with:
          run-id: 45647088882
          github-token: ${{ github.token }}
          pattern: release-windows-*
          path: release-artifacts
          merge-multiple: true

      - name: Select and verify the three previously attested ZIPs
        id: archives
        shell: bash
        run: |
          archives=()
          for platform in win32 win64 win-arm64; do
            archive="release-artifacts/zstd-${RELEASE_TAG}-${platform}.zip"
            test -s "$archive"
            archives+=("$archive")
          done

          # These SHA-256 values were checked independently against the
          # attestation recorded by the original Windows publisher job.
          sha256sum --check --strict <<CHECKSUMS
          d9f5329e33f1909643d629f569be4a9d2822bbe1f09d5ae64f22d3e87fd6b358  ${archives[0]}
          67187e82bfad9973e88b03e7d8a404f3f51e07815e329e88aa9ae356468c0c7d  ${archives[1]}
          d5725b23cd1a37ad5cfbb2784d9095f038124bf7771eefb8ff01f2f966759636  ${archives[2]}
          CHECKSUMS

          {
            echo 'paths<<EOF'
            printf '%s\n' "${archives[@]}"
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Verify the combined publisher on a partial draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          original_tag=$RELEASE_TAG
          GITHUB_REF_NAME=ci-verify-zstd-no-overwrite-20261125
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME" --jq .object.sha)" = "$BUILD_HEAD"
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag   --title 'CI-only zstd partial upload verification'   --notes 'Unpublished fixture. This draft contains test copies of the original verified zstd packages.'   --repo "$GITHUB_REPOSITORY"
          draft_id=$(gh api "repos/$GITHUB_REPOSITORY/releases" --jq ".[] | select(.draft and .tag_name == \"$GITHUB_REF_NAME\") | .id")
          test -n "$draft_id"
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/$draft_id" --jq '.draft and (.assets|length == 0)')" = true
          paths=()
          for platform in win32 win64 win-arm64; do
              path="release-artifacts/zstd-${GITHUB_REF_NAME}-${platform}.zip"
              cp "release-artifacts/zstd-${original_tag}-${platform}.zip" "$path"
              paths+=("$path")
          done
          gh release upload "$GITHUB_REF_NAME" "${paths[0]}" --repo "$GITHUB_REPOSITORY"
          seed=$(gh api "repos/$GITHUB_REPOSITORY/releases/$draft_id" --jq 'select(.draft and (.assets|length == 1)) | .assets[0] | {id,name,digest}')
          test -n "$seed"
          all_paths=$(printf '%s\n' "${paths[@]}")
          preflight() {
              mapfile -t archives <<< "$ARCHIVE_PATHS"
              release=$(gh api "repos/$GITHUB_REPOSITORY/releases/$draft_id")
              pending=()

              for archive in "${archives[@]}"; do
                name=${archive##*/}
                asset=$(jq -c --arg name "$name" '.assets[] | select(.name == $name)' <<< "$release")
                if [[ -z "$asset" ]]; then
                  pending+=("$archive")
                  continue
                fi

                digest=$(jq -r '.digest // empty' <<< "$asset")
                if [[ -z "$digest" ]]; then
                  echo "Existing release asset $name has no recorded SHA-256 digest" >&2
                  exit 1
                fi

                local_digest=$(sha256sum -- "$archive")
                if [[ "$digest" != "sha256:${local_digest%% *}" ]]; then
                  echo "Existing release asset $name differs from the generated artifact" >&2
                  exit 1
                fi
                echo "$name already exists with the generated digest"
              done

              {
                echo 'paths<<EOF'
                if (( ${#pending[@]} )); then
                  printf '%s\n' "${pending[@]}"
                fi
                echo EOF
              } >> "$GITHUB_OUTPUT"
          }

          GITHUB_OUTPUT=$(mktemp)
          ARCHIVE_PATHS=$all_paths
          preflight
          ARCHIVE_PATHS=$(sed '1d;$d' "$GITHUB_OUTPUT")
          test "$ARCHIVE_PATHS" = "$(printf '%s\n' "${paths[@]:1}")"
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/$draft_id" --jq '.draft')" = true
          mapfile -t archives <<< "$ARCHIVE_PATHS"
          gh release upload "$GITHUB_REF_NAME" "${archives[@]}" --repo "$GITHUB_REPOSITORY"
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/$draft_id" --jq '.draft and (.assets|length == 3)')" = true
          after=$(gh api "repos/$GITHUB_REPOSITORY/releases/$draft_id" --jq ".assets[] | select(.name == \"${paths[0]##*/}\") | {id,name,digest}")
          test "$seed" = "$after"
          GITHUB_OUTPUT=$(mktemp)
          ARCHIVE_PATHS=$all_paths
          preflight
          test -z "$(sed '1d;$d' "$GITHUB_OUTPUT")"
          printf 'Verified draft release ID %s; the existing package was unchanged.\n' "$draft_id"
